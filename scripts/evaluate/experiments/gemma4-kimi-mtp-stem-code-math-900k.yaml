# SPEED-Bench evaluation — Gemma 4 31B-it backbone + the 900k EAGLE3 draft
# (kimi MTP, STEM + code + math mix).
#
# Run:  cd scripts/evaluate/experiments
#       python run_experiments.py --config gemma4-kimi-mtp-stem-code-math-900k.yaml --dry-run
#       python run_experiments.py --config gemma4-kimi-mtp-stem-code-math-900k.yaml
#
# The runner launches one vLLM server per experiment (backbone, optionally with a
# draft attached via --speculative-config), runs the acceptance/throughput eval,
# stops the server, then prints a speedup table (first experiment = baseline).

engine: vllm
# Local copy on scratch (downloaded from google/gemma-4-31B-it); the HF id
# "google/gemma-4-31B-it" also works and is ungated.
backbone: /sms-scratch/checkpoints/gemma-4-31B-it
gpus: "0,1,2,3,4,5,6,7"                          # CUDA_VISIBLE_DEVICES for the server

server:
  host: 127.0.0.1
  port: 8000
  # gemma-4-31B-it is ~62.6 GB in bf16. tensor_parallel_size: 2 fits comfortably
  # on 2x80GB (or is required on 40GB GPUs); use 1 on a single 80GB GPU if the KV
  # cache headroom is enough for your max_model_len.
  tensor_parallel_size: 8
  gpu_memory_utilization: 0.9
  # The longest qualitative prompt (RAG) is ~4.6k tokens; with max_tokens 4096
  # that is ~8.7k, so 16384 leaves headroom across all 11 slices.
  max_model_len: 16384
  health_timeout: 1800                           # s to wait for /health (weight load + graph capture)
  extra_args: []                                 # extra `vllm serve` flags

eval:
  backend: vllm                                  # mtp_server_eval evaluator: vllm | sglang
  mode: acceptance                               # acceptance | throughput | sweep (GuideLLM)
  # NVIDIA SPEED-Bench (nvidia/SPEED-Bench) qualitative split: all 11 categories
  # x 80 prompts = 880, matching Table 1 of the SPEED-Bench paper
  # (arxiv 2604.09557). Prepared under mtp_server_eval/data/.
  benchmarks:
    - speed-humanities
    - speed-math
    - speed-reasoning
    - speed-roleplay
    - speed-stem
    - speed-summarization
    - speed-writing
  # The throughput slice, speed-low-entropy, is also prepared (512 prompts) but
  # its prompts are 15.8k–21.4k tokens, so it needs max_model_len 32768 — it runs
  # from its own config:
  #   python run_experiments.py --config gemma4-kimi-mtp-stem-code-math-900k-low-entropy.yaml
  num_samples: 0                                 # 0 = all prompts (880 total here)
  max_tokens: 4096
  temperature: 0.0                               # greedy = canonical acceptance

output_dir: ./results/gemma4_draft_model_900k_eagle3_kimi_mtp_stem_code_math_speedbench_run2

experiments:
  # First entry is the baseline (backbone alone, no draft) — the speedup denominator.
  # - name: baseline

  - name: eagle3
    # speculators-format EAGLE3 draft; its own config declares speculative_tokens: 3,
    # set below explicitly to keep the run self-documenting.
    draft: /sms-scratch/ravira/checkpoints/gemma4_draft_model_900k_eagle3_kimi_mtp_stem_code_math/checkpoint_best/
    num_speculative_tokens: 3

# Previous (non-SPEED-Bench) benchmark list for this checkpoint, if you want it back:
#   eval.benchmarks: [aime, gpqa, livecodebench]
