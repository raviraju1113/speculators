# Full-suite eval: gemma-4-31B-it + the Mamba2 Eagle-3 draft (Arm B), k=5 and k=3.
#
# Emulates `gemma4-31b-full-eagle3.yaml` -- same 25 benchmarks, 50 samples,
# max_tokens 4096, greedy, TP=4, max_model_len 8192 -- so results drop into the table in
# docs/user_guide/tutorials/gemma4_31b_full_spec_decode_results.md.
#
# The transformer Arm A draft runs as the last experiment, on the same server in the
# same run. That is the comparison that matters: the published Arm A numbers were taken
# on a different vLLM build with different flags (prefix caching on, 0.9 utilization),
# so they are NOT directly comparable to the rows below. Both arms here share identical
# settings. Drop `eagle3_qwen_k5` only if you accept losing that control.
#
# REQUIREMENTS
#   * vLLM >= 0.25.1 + the patch in vllm_patches/ (threads Mamba metadata through the
#     drafting loop) and an editable `pip install -e .` so the
#     `vllm.general_plugins` entry point registers Eagle3Mamba2ForCausalLM. Verify:
#       python -c "from vllm import ModelRegistry; \
#         print('Eagle3Mamba2ForCausalLM' in ModelRegistry.get_supported_archs())"
#   * `method: eagle3` below is REQUIRED, not cosmetic. vLLM infers the method from the
#     checkpoint *path string* (`"eagle3" in model.lower()`); this draft's directory is
#     `..._e3_mamba2_...`, so without it the method silently degrades to
#     `draft_model` and the draft is called as a standalone LM.
#
# SERVER FLAGS differ from the eagle3 config, and each one is load-bearing:
#   --mamba-block-size 8192      vLLM only derives this for hybrid *targets*, but the
#                                draft's MambaSpec asserts it is set. Must equal
#                                max_model_len unless prefix caching is on.
#   --no-enable-prefix-caching   with prefix caching on, the block-hash divisibility
#                                assert fires for the draft's Mamba group.
#   --gpu-memory-utilization .65 at 0.9, warmup OOMs wanting 32 GiB for an SSD scan
#                                intermediate; vLLM's memory profiling does not
#                                account for draft chunked-scan buffers. Conservative
#                                on purpose -- an OOM hours into the suite is costly.
#   --max-num-batched-tokens     must be >= max_tokens_per_mm_item (2496); Gemma-4 is
#                                a VLM.
# CUDA graphs are ON (no --enforce-eager); verified faithful -- graph and eager agree on
# acceptance to within 0.02 accept_len.
#
# Run:
#   conda activate speculators
#   cd scripts/evaluate/experiments
#   python run_experiments.py --config gemma4-31b-full-mamba2.yaml --dry-run   # inspect
#   python run_experiments.py --config gemma4-31b-full-mamba2.yaml

engine: vllm
backbone: /sms-scratch/checkpoints/gemma-4-31B-it
gpus: "0,1,2,3"

server:
  host: 127.0.0.1
  port: 8000
  tensor_parallel_size: 4
  gpu_memory_utilization: 0.65
  max_model_len: 8192
  health_timeout: 1800
  extra_args:
    - --mamba-block-size
    - "8192"
    - --no-enable-prefix-caching
    - --max-num-batched-tokens
    - "4096"
    - --max-num-seqs
    - "32"

eval:
  backend: vllm
  mode: acceptance
  benchmarks:
    - aime
    - gpqa
    - livecodebench
    - gsm8k
    - humaneval
    - mbpp
    - math500
    - mt-bench
    - aime26
    - bfcl
    - swe-bench-pro
    - speed-coding
    - speed-multilingual
    - speed-rag
    - speed-qa
    - speed-writing
    - HumanEval
    - math_reasoning
    - qa
    - question
    - rag
    - summarization
    - tool_call
    - translation
    - writing
  num_samples: 50
  max_tokens: 4096
  temperature: 0.0

output_dir: ./results/gemma4-31b-full-mamba2

experiments:
  - name: mamba2_k5
    draft: /sms-scratch/ravira/checkpoints/gemma4_draft_model_900k_e3_mamba2_kimi_mtp_stem_code_math/checkpoint_best
    num_speculative_tokens: 5
    speculative_config: {method: eagle3}

  - name: mamba2_k3
    draft: /sms-scratch/ravira/checkpoints/gemma4_draft_model_900k_e3_mamba2_kimi_mtp_stem_code_math/checkpoint_best
    num_speculative_tokens: 3
    speculative_config: {method: eagle3}

  # Arm A control: same 900k stem-code-math mix, matched scaffolding
  # (adamw, norm_before_fc=False, norm_output=False), same server, same run.
  - name: eagle3_qwen_k5
    draft: /sms-scratch/ravira/checkpoints/gemma4_draft_model_900k_eagle3_kimi_mtp_stem_code_math/checkpoint_best
    num_speculative_tokens: 5
    speculative_config: {method: eagle3}
