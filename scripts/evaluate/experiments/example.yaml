# Speculative-decoding evaluation experiments (8xA100 example).
#
# Run:  python run_experiments.py --config example.yaml
#       python run_experiments.py --config example.yaml --dry-run   # print commands only
#
# The runner launches one vLLM server per experiment (backbone, optionally with a
# draft attached via --speculative-config), runs the acceptance/throughput eval,
# stops the server, then prints a speedup table (first experiment = baseline).

engine: vllm
backbone: meta-llama/Llama-3.1-70B-Instruct     # target / verifier model
gpus: "0,1,2,3,4,5,6,7"                          # CUDA_VISIBLE_DEVICES for the server

server:
  host: 127.0.0.1
  port: 8000
  tensor_parallel_size: 8                        # 8xA100
  gpu_memory_utilization: 0.9
  max_model_len: 8192
  health_timeout: 1800                           # s to wait for /health (weight load + graph capture)
  extra_args: []                                 # extra `vllm serve` flags, e.g. ["--enable-chunked-prefill"]

eval:
  backend: vllm                                  # mtp_server_eval evaluator: vllm | sglang
  benchmarks: [aime, gpqa, livecodebench]
  num_samples: 50                                # per benchmark (0 = all)
  max_tokens: 4096
  temperature: 0.0                               # greedy = canonical acceptance

output_dir: ./results/experiments

experiments:
  # First entry is the baseline (backbone alone, no draft) — the speedup denominator.
  - name: baseline

  # Attach a draft and sweep the speculative depth.
  - name: eagle3_k5
    draft: RedHatAI/Llama-3.1-70B-Instruct-speculator.eagle3
    num_speculative_tokens: 5

  - name: eagle3_k3
    draft: RedHatAI/Llama-3.1-70B-Instruct-speculator.eagle3
    num_speculative_tokens: 3
    eval:                                         # per-experiment overrides (merged over defaults)
      num_samples: 100
