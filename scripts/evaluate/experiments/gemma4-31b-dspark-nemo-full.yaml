# Nemo782k checkpoint-of-record (ep24) at k=3, k=5, AND k=8, FULL benchmark
# sets (aime 30, gpqa-diamond 198, livecodebench 1055; num_samples 0 = all).
# Mirrors gemma4-31b-dspark-scratch.yaml (scratch ep15, same three k) so the
# two runs plot head-to-head at k3/k5/k8 on full-data precision.
# The old n=30 numbers (ep24 k8 5.89/4.43/5.25) are NOT directly comparable --
# full-data is the new standard; label tables accordingly.
# No baseline experiment here -> IGNORE the in-log speedup column; compute
# speedups against the measured backbone baseline 59.5 tok/s (same harness,
# results/gemma4-31b-dspark-meeting/results_table_b200.csv).
# !! True-trained checkpoint: REQUIRES the patched vllm (dspark-host venv).

engine: vllm
backbone: /sms-scratch/checkpoints/gemma-4-31B-it
# gpus unset -> inherit CUDA_VISIBLE_DEVICES

server:
  host: 127.0.0.1
  port: 8500   # not 8400: may co-locate with the scratch eval on one node
  tensor_parallel_size: 1
  gpu_memory_utilization: 0.92
  max_model_len: 4096
  health_timeout: 1800
  extra_args:
    - "--enforce-eager"
    - "--no-enable-prefix-caching"
    - "--chat-template"
    - "/sms-scratch/checkpoints/gemma-4-31B-it/chat_template.jinja"

eval:
  backend: vllm
  benchmarks: [aime, gpqa, livecodebench]
  num_samples: 0        # 0 = all samples
  max_tokens: 2048
  temperature: 0.0

output_dir: ./results/gemma4-31b-dspark-nemo-full

experiments:
  - name: nemo_ep24_k3_full
    draft: /sms-scratch/mengmengj/output/gemma4_31b_dspark_anchorT_nemo782k/checkpoints/24
    num_speculative_tokens: 3
    speculative_config:
      method: dspark

  - name: nemo_ep24_k5_full
    draft: /sms-scratch/mengmengj/output/gemma4_31b_dspark_anchorT_nemo782k/checkpoints/24
    num_speculative_tokens: 5
    speculative_config:
      method: dspark

  - name: nemo_ep24_k8_full
    draft: /sms-scratch/mengmengj/output/gemma4_31b_dspark_anchorT_nemo782k/checkpoints/24
    num_speculative_tokens: 8
    speculative_config:
      method: dspark
