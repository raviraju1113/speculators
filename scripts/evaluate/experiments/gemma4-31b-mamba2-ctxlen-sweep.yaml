# Long-context sweep: gemma-4-31B-it, Mamba2 draft (Arm B) vs Qwen3 draft (Arm A),
# AA-LCR bins 1k -> 128k.
#
# THIS IS THE TEST THE PROJECT EXISTS FOR. The 25-benchmark suite
# (`gemma4-31b-full-mamba2.yaml`) ran at max_model_len 8192 and showed Arm B matching
# Arm A on acceptance (2.937 vs 2.835) at equal throughput. But the proposal's argument
# was never about 8k: it is that a Mamba2 draft carries a constant ~5.6 MB recurrent
# state while a transformer draft's KV cache grows to ~4.29 GB per sequence at 256K
# (16,384 B/token for this draft's 16 KV heads x 256 head_dim). At 8k that difference is
# worth nothing. These bins are where it starts to pay -- or where a fixed-size state
# starts losing fidelity because it must compress more as context grows. Both outcomes
# are informative; neither is visible at 8k.
#
# Baseline (no draft) runs first and is the speedup denominator, so the decision metric
# -- decode tok/s ratio -- is available per bin rather than inferred across runs.
#
# Bins ascend so a failure surfaces on the cheapest bin first. `aa-lcr-128k` is not a
# fixed length: AA-LCR documents top out around 123k, so those rows carry their full
# untruncated documents (mean ~107k). Plot it at its mean actual length, not 131072.
#
# Comparability: the recorded 2026-08-19 eagle3 curve (accept_len 2.315 at 1k -> 2.137
# at 32k) used k=3 and a different vLLM build, so it is a reference, not a control.
# Arm A is re-run here at k=5 alongside Arm B under identical settings; compare within
# this run.
#
# Mamba-specific server flags (see vllm_patches/README.md for why each is needed):
#   --mamba-block-size must equal max_model_len when prefix caching is off.
#   --max-num-batched-tokens bounds the draft's chunked-scan intermediates during the
#   long prefills; these are not accounted for in vLLM's memory profiling.
#
# Run:
#   conda activate speculators        # the runner calls a bare `vllm`
#   cd scripts/evaluate/experiments
#   python run_experiments.py --config gemma4-31b-mamba2-ctxlen-sweep.yaml

engine: vllm
backbone: /sms-scratch/checkpoints/gemma-4-31B-it
gpus: "0,1,2,3,4,5,6,7"

server:
  host: 127.0.0.1
  port: 8000
  tensor_parallel_size: 8
  gpu_memory_utilization: 0.8
  # Longest 128k-bin prompt is 123,035 tokens; + max_tokens 1024 => 124,059.
  max_model_len: 131072
  health_timeout: 3600
  extra_args:
    - --mamba-block-size
    - "131072"
    - --no-enable-prefix-caching
    - --max-num-batched-tokens
    - "8192"
    - --max-num-seqs
    - "16"

eval:
  backend: vllm
  mode: acceptance
  benchmarks:
    - aa-lcr-1k
    - aa-lcr-2k
    - aa-lcr-4k
    - aa-lcr-8k
    - aa-lcr-16k
    - aa-lcr-32k
    - aa-lcr-64k
    - aa-lcr-128k
  num_samples: 0          # all 100 per bin
  max_tokens: 1024        # AA-LCR answers are short; ample decode for acceptance stats
  temperature: 0.0        # greedy = canonical acceptance

output_dir: ./results/gemma4-31b-mamba2-ctxlen-sweep

experiments:
  # First entry is the speedup denominator.
  - name: baseline

  - name: mamba2_k5
    draft: /sms-scratch/ravira/checkpoints/gemma4_draft_model_900k_e3_mamba2_kimi_mtp_stem_code_math/checkpoint_best
    num_speculative_tokens: 5
    speculative_config: {method: eagle3}

  - name: eagle3_qwen_k5
    draft: /sms-scratch/ravira/checkpoints/gemma4_draft_model_900k_eagle3_kimi_mtp_stem_code_math/checkpoint_best
    num_speculative_tokens: 5
    speculative_config: {method: eagle3}
