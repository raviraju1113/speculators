# GLM-5.3 FULL suite (Mengmeng's glm53-full-v033-b300.yaml, README §9.w.4: 28 listed, 22 run
# -- the six SPEED-Bench categories humanities/math/reasoning/roleplay/stem/summarization have
# no data file on sc3 and the evaluator skips them) for OUR drafts, on ONE 8xB200 node.
# Same eval settings as hers (50 samples/benchmark, seed 42, T 1.0, top-p 0.95, effort max,
# clear_thinking, max_tokens 4096, max_model_len 131072 so aa-lcr's ~95k prompts fit), but the
# official FP8 target: bf16 GLM-5.3 does not fit one B200 node and DFlash2 cannot use PP. Her
# B300/bf16 numbers are therefore not the denominator; incoai and baseline are re-run here.
#
# ~1,080 prompts per experiment: a draft ~4.5 h, baseline ~9.5 h. Run with --only <name>, in
# priority order: ours_ep9_k6, incoai_k7, then the clean on-policy FT checkpoints as they land,
# baseline last (only needed for speedups).
#
#   JOBID=<eval alloc> CONFIG=examples/train/glm53/eval_glm53_full22_fp8_v033.yaml \
#     bash examples/train/glm53/launch_eval_glm53_salloc.sh --only ours_ep9_k6

engine: vllm
backbone: /import/ml-sc-nlpcheckpoints-scratch3/mengmengj/glm-5.3
gpus: "0,1,2,3,4,5,6,7"

server:
  host: 127.0.0.1
  port: 8000
  tensor_parallel_size: 8
  gpu_memory_utilization: 0.92
  max_model_len: 131072
  health_timeout: 3600
  extra_args:
    - --distributed-executor-backend
    - mp
    - --block-size
    - "64"
    - --kv-cache-dtype
    - auto
    - --enable-expert-parallel
    - --trust-remote-code
    - --served-model-name
    - glm-5.3
    - --max-num-seqs
    - "32"

eval:
  backend: vllm
  mode: acceptance
  benchmarks:
    - gsm8k
    - humaneval
    - mbpp
    - speed-coding
    - speed-humanities
    - speed-math
    - speed-multilingual
    - speed-rag
    - speed-reasoning
    - speed-roleplay
    - speed-stem
    - speed-summarization
    - math500
    - swe-bench-pro
    - aa-lcr
    - mt-bench
    - speed-qa
    - speed-writing
    - aime26
    - HumanEval
    - math_reasoning
    - qa
    - question
    - rag
    - summarization
    - tool_call
    - translation
    - writing
  num_samples: 50
  max_tokens: 4096
  temperature: 1.0
  top_p: 0.95
  seed: 42
  extra_body:
    chat_template_kwargs:
      reasoning_effort: max
      clear_thinking: true

output_dir: /import/ml-sc-scratch1/ravir/spec_decoding_work/glm53_dflash2/eval/glm53-full22-fp8-v033

experiments:
  - name: ours_ep9_k6                   # off-policy Kimi-recipe draft (FT starting point)
    draft: /import/ml-sc-scratch1/ravir/spec_decoding_work/glm53_dflash2/output/glm53_dflash2_gemma782k_kimirecipe_v2/checkpoints_vllm/8
    speculative_config: {method: dflash}
    num_speculative_tokens: 6

  - name: incoai_k7                     # released card draft, same FP8 server
    draft: /import/ml-sc-nlpcheckpoints-scratch3/mengmengj/glm-5.3-dflash2-incoai
    speculative_config: {method: dflash}
    num_speculative_tokens: 7

  - name: baseline                      # speedup denominator (~9.5 h; run last)

  # Clean on-policy FT checkpoints (shard-A data; one epoch = 3,648 steps), snapshotted to
  # output/glm53_dflash2_onpolicyA_ft3ep_lr2e-5/snapshots/<tag> and exported to snapshots_vllm/<tag>.
  - name: ftA_ep0.5_k6                  # half epoch (step 1,824)
    draft: /import/ml-sc-scratch1/ravir/spec_decoding_work/glm53_dflash2/output/glm53_dflash2_onpolicyA_ft3ep_lr2e-5/snapshots_vllm/ep0_step1824
    speculative_config: {method: dflash}
    num_speculative_tokens: 6
